<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yavuz Çelik — Full Stack .NET Developer">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- zemin: sıcak kırık beyaz -->
  <rect width="1000" height="260" rx="16" fill="#faf9f7"/>

  <!-- yumuşak glow'lar -->
  <circle cx="190" cy="30" r="230" fill="url(#glowViolet)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="235" r="215" fill="url(#glowBlue)">
    <animate attributeName="opacity" values="1;0.6;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- köşe süsleri: mono parantezler -->
  <text x="56" y="140" font-family="'Cascadia Code','Consolas','JetBrains Mono',monospace" font-size="90" fill="#ece9e4">{</text>
  <text x="906" y="140" font-family="'Cascadia Code','Consolas','JetBrains Mono',monospace" font-size="90" fill="#ece9e4">}</text>

  <!-- içerik -->
  <text x="500" y="92" text-anchor="middle" font-family="'Cascadia Code','Consolas','JetBrains Mono',monospace" font-size="15" letter-spacing="4" fill="#b45309">// hi, I&#8217;m</text>
  <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="url(#brand)">Yavuz Çelik</text>
  <text x="500" y="192" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" letter-spacing="1.5" fill="#44403c">Full Stack .NET Developer</text>

  <!-- gradient aksan çizgisi -->
  <rect x="450" y="212" width="100" height="3" rx="1.5" fill="url(#brand)"/>

  <!-- ince çerçeve -->
  <rect x="0.5" y="0.5" width="999" height="259" rx="15.5" stroke="#e7e5e4"/>
</svg>
